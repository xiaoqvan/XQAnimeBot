[package]
name = "fuyubot-plugin-mongo"
description = "FuyuBot MongoDB 插件：注册 storage.mongo 服务，给任意插件提供集合级 CRUD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# cdylib 给宿主加载；rlib 让示例/集成测试能直接调用业务逻辑。
crate-type = ["cdylib", "rlib"]

[dependencies]
bson.workspace = true
fuyubot-abi.workspace = true
fuyubot-service.workspace = true
futures-util.workspace = true
mongodb.workspace = true
serde_json.workspace = true
tokio.workspace = true
