<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权回调处理</title>
    
    <!-- 引入 Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #f0fff4 0%, #d1fae5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 1rem;
        }
        
        .loader {
            border-top-color: #10b981; 
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 主卡片容器 -->
    <div class="bg-white/90 backdrop-blur-lg w-full max-w-md rounded-2xl shadow-xl overflow-hidden fade-in relative">
        
        <!-- 顶部装饰条 -->
        <div class="h-2 bg-gradient-to-r from-green-200 to-emerald-300"></div>

        <!-- 内容区域 -->
        <div class="px-6 pt-6 pb-2 md:px-8 md:pt-8 md:pb-4 text-center">
            
            <!-- 1. 加载状态 -->
            <div id="view-loading" class="block">
                <div class="flex justify-center mb-6">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-16 w-16"></div>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">正在验证...</h2>
                <p class="text-gray-500 text-sm">正在处理您的授权请求，请稍候。</p>
            </div>

            <!-- 2. 成功状态 -->
            <div id="view-success" class="hidden">
                <div class="flex justify-center mb-6">
                    <div class="rounded-full bg-green-50 p-3">
                        <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">授权成功</h2>
                <p class="text-gray-500 mb-6">正在唤起 Telegram...</p>
                
                <!-- 修改为复制按钮 -->
                <button id="btn-copy-link" type="button" class="block w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 px-4 rounded-xl transition duration-300 shadow-md transform active:scale-95 cursor-pointer">
                    复制链接
                </button>
                
                <!-- 添加提示文案 -->
                <p class="text-xs text-gray-400 mt-3 px-2 leading-relaxed">
                    如果无法自动跳转，请点击按钮复制链接并在浏览器中打开。
                </p>
            </div>

            <!-- 3. 错误状态 -->
            <div id="view-error" class="hidden">
                <div class="flex justify-center mb-6">
                    <div class="rounded-full bg-red-100 p-3">
                        <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">无法完成授权</h2>
                <p class="text-gray-500 text-sm mb-6">未能获取到有效的验证码或状态参数。这可能是因为您直接访问了此链接，或者会话已过期。</p>

                <!-- 操作按钮组 -->
                <div class="space-y-3">
                    <a href="https://t.me/XiaoQvanAnimeBot" class="block w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 px-4 rounded-xl transition duration-300 shadow-md">
                        返回 Bot 重新获取
                    </a>
                    
                    <div class="bg-yellow-50 border border-yellow-100 rounded-xl p-3 text-left mt-4">
                        <p class="text-xs text-yellow-800 font-semibold mb-1">💡 还是不行？</p>
                        <p class="text-xs text-yellow-700 leading-relaxed">
                            如果点击授权链接后没有授权页面直接跳转主页，请在Bangumi退出账户重新登录。
                        </p>
                    </div>
                </div>
            </div>

        </div>
        
        <!-- 底部版权/信息 -->
        <div class="bg-gray-50 px-6 py-3 text-center border-t border-gray-100">
            <p class="text-xs text-gray-400">XiaoQvan Anime Bot Authorization</p>
            <div class="text-[10px] text-gray-400/80 mt-1 space-x-1">
                <a href="https://gemini.google.com" target="_blank" rel="noopener" class="hover:text-emerald-500 transition-colors">由 Gemini 生成</a>
                <span>•</span>
                <a href="https://t.me/xiaoqvan" target="_blank" rel="noopener" class="hover:text-emerald-500 transition-colors">By XiaoQvan</a>
                <span>•</span>
                <a href="https://t.me/XiaoQvanAnimeBot" target="_blank" rel="noopener" class="hover:text-emerald-500 transition-colors">XiaoQvan的番剧姬</a>
            </div>
        </div>
    </div>

    <script>
        // ================= 配置区域 =================
        const BOT_BASE_URL = "https://t.me/mengcat_bot?start=";
        const BASE62_CHARS = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
        // ===========================================

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(handleAuthLogic, 300);
        });

        function hexToBase62(hex) {
            try {
                let val = BigInt('0x' + hex);
                let result = '';
                const base = 62n;
                if (val === 0n) return '0';
                while (val > 0n) {
                    const remainder = val % base;
                    val = val / base;
                    result = BASE62_CHARS[Number(remainder)] + result;
                }
                return result;
            } catch (e) {
                console.error("Base62 conversion failed:", e);
                return hex; 
            }
        }

        function handleAuthLogic() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const state = urlParams.get('state');

                if (!code || !state) {
                    console.warn("Auth Info: Missing 'code' or 'state' parameter. Showing error view.");
                    switchView('view-error');
                    return;
                }

                // ================= 成功逻辑 =================
                
                const shortCode = hexToBase62(code);
                const payload = `bgm_cb-${shortCode}_${state}`;
                const finalUrl = BOT_BASE_URL + payload;

                // 切换到成功视图
                switchView('view-success');

                // 设置复制按钮逻辑
                const btn = document.getElementById('btn-copy-link');
                btn.onclick = function() {
                    copyToClipboard(finalUrl, btn);
                };

                // 尝试自动跳转
                setTimeout(() => {
                    window.location.replace(finalUrl);
                }, 800);

            } catch (error) {
                console.error("Critical Auth Error:", error);
                switchView('view-error');
            }
        }

        // --- 复制功能 (带回退方案) ---
        function copyToClipboard(text, btnElement) {
            // 成功回调：更改按钮文字
            const onSuccess = () => {
                const originalText = "复制链接";
                btnElement.textContent = "已复制 ✅";
                btnElement.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
                btnElement.classList.add('bg-green-600'); // 复制成功后颜色变深一点
                
                setTimeout(() => {
                    btnElement.textContent = originalText;
                    btnElement.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
                    btnElement.classList.remove('bg-green-600');
                }, 2000);
            };

            // 失败回调
            const onError = (err) => {
                console.error('Copy failed', err);
                btnElement.textContent = "复制失败 ❌";
                setTimeout(() => btnElement.textContent = "复制链接", 2000);
            };

            // 优先使用标准 API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(onSuccess, () => fallbackCopy(text, onSuccess, onError));
            } else {
                fallbackCopy(text, onSuccess, onError);
            }
        }

        // 兼容性复制方案 (创建隐藏 textarea)
        function fallbackCopy(text, onSuccess, onError) {
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed"; // 避免滚动到底部
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                
                if (successful) onSuccess();
                else onError();
            } catch (err) {
                onError(err);
            }
        }

        function switchView(viewId) {
            document.getElementById('view-loading').classList.add('hidden');
            document.getElementById('view-success').classList.add('hidden');
            document.getElementById('view-error').classList.add('hidden');
            
            const target = document.getElementById(viewId);
            if (target) {
                target.classList.remove('hidden');
                target.classList.add('fade-in');
            }
        }
    </script>
</body>
</html>
